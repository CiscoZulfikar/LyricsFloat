<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LyricsFloat</title>
  <link rel="stylesheet" href="index.css">
</head>
<body class="theme-nordic-frost">

  <div class="window-container">
    <!-- Album Art Ambient Fluid Backdrop -->
    <div id="album-ambient-backdrop" class="album-ambient-backdrop"></div>

    <!-- Top Drag Bar & Hover Controls -->
    <header class="window-header">
      <div class="drag-region">
        <div class="app-brand">
          <img src="assets/icon.png" class="brand-icon" alt="LyricsFloat">
          <span class="brand-title">LyricsFloat</span>
        </div>

      </div>
      <div class="header-controls">
        <button id="btn-toggle-romaji" class="btn-tool active" title="Pronunciation / Romaji (あ→a)">
          <span class="badge-kanji">あ</span><span class="badge-arrow">→</span><span class="badge-latin">a</span>
        </button>
        <button id="btn-toggle-translation" class="btn-tool active" title="Translation (Meaning)">
          <svg width="13.5" height="13.5" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0014.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/>
          </svg>
        </button>
        <button id="btn-pin" class="btn-tool active" title="Always on Top">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M16 9V4l1 0c0.55 0 1-0.45 1-1s-0.45-1-1-1H7C6.45 2 6 2.45 6 3s0.45 1 1 1l1 0v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2C17.34 12 16 10.66 16 9z"/></svg>
        </button>
        <button id="btn-open-settings" class="btn-tool" title="Settings">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
        </button>
        <button id="btn-minimize" class="btn-tool" title="Minimize">&minus;</button>
        <button id="btn-close" class="btn-tool btn-close" title="Close">&times;</button>
      </div>
    </header>

    <!-- Miniplayer Track Info Bar -->
    <section class="track-banner">
      <div class="track-header-row">
        <div id="track-cover-wrapper" class="track-cover-wrapper">
          <img id="track-cover-img" class="track-cover-img" src="" alt="Album Art" style="display: none;">
          <div id="track-cover-fallback" class="track-cover-fallback">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5zm0-5.5c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z"/></svg>
          </div>
          <div class="track-cover-ambient-glow"></div>
        </div>
        <div class="track-details">
          <div class="track-title-row">
            <span id="badge-explicit" class="badge-explicit hidden" title="Explicit">E</span>
            <div class="track-title-container">
              <div id="track-title" class="track-title">Waiting for Spotify...</div>
            </div>
          </div>
          <div class="track-artist-container">
            <div id="track-artist" class="track-artist">Play a track to start floating lyrics</div>
          </div>
        </div>
        <div class="playback-controls-row">
          <button id="btn-prev" class="btn-playback" title="Previous Track">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button id="btn-play-pause" class="btn-playback btn-play-pause" title="Play/Pause (Space)">
            <svg id="icon-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="icon-pause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <button id="btn-next" class="btn-playback" title="Next Track">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
        </div>
      </div>

      <div class="timeline-row">
        <span id="time-current" class="time-label">0:00</span>
        <div class="track-progress-container">
          <div id="track-progress-bar" class="track-progress-bar">
            <div class="progress-handle"></div>
          </div>
        </div>
        <span id="time-duration" class="time-label">0:00</span>
      </div>
    </section>

    <!-- Karaoke Lyrics Stream Container -->
    <main class="lyrics-viewport">
      <div id="lyrics-stream" class="lyrics-stream">
        <div class="lyrics-idle-message">
          <div class="idle-pulse-ring"></div>
          <span>Spotify Desktop playback will sync automatically</span>
        </div>
      </div>
      <button id="btn-jump-active" class="btn-jump-active hidden">
        <span class="jump-arrow">↓</span>
        <span>Jump to Singing Line</span>
      </button>
    </main>

    <!-- Floating Translation Loading Pill -->
    <div id="translation-status-pill" class="translation-status-pill hidden">
      <span class="pill-spinner" id="pill-spinner"></span>
      <span id="pill-icon" class="pill-ready-icon" style="display: none;">✓</span>
      <span id="pill-text" class="pill-text">Translating lyrics...</span>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-backdrop hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Settings & Preferences</h3>
          <button id="btn-close-settings" class="modal-close-btn">&times;</button>
        </div>

        <!-- Settings Tabs Navigation -->
        <div class="settings-tabs-nav" id="settings-tabs-nav">
          <button type="button" class="settings-tab-btn active" data-tab="theme" title="Theme">
            <span class="tab-icon">🎨</span>
            <span class="tab-label">Theme</span>
          </button>
          <button type="button" class="settings-tab-btn" data-tab="lyrics" title="Lyrics">
            <span class="tab-icon">✍️</span>
            <span class="tab-label">Lyrics</span>
          </button>
          <button type="button" class="settings-tab-btn" data-tab="translation" title="Translation">
            <span class="tab-icon">🌐</span>
            <span class="tab-label">Translation</span>
          </button>
          <button type="button" class="settings-tab-btn" data-tab="about" title="About">
            <span class="tab-icon">ℹ️</span>
            <span class="tab-label">About</span>
          </button>
        </div>

        <div class="modal-body">

          <!-- Tab 1: Theme -->
          <div class="settings-tab-pane active" id="tab-pane-theme">
            <div class="setting-item">
              <label>Color Theme</label>
              <div id="theme-grid" class="theme-grid">
                <button class="theme-card" data-theme="theme-neon-violet" type="button">
                  <span class="theme-dot" style="background: linear-gradient(135deg, #c084fc, #38bdf8);"></span>
                  <span class="theme-name">Violet</span>
                </button>
                <button class="theme-card" data-theme="theme-cyberpunk-cyan" type="button">
                  <span class="theme-dot" style="background: linear-gradient(135deg, #06b6d4, #facc15);"></span>
                  <span class="theme-name">Cyan</span>
                </button>
                <button class="theme-card" data-theme="theme-crimson-sunset" type="button">
                  <span class="theme-dot" style="background: linear-gradient(135deg, #f43f5e, #fb923c);"></span>
                  <span class="theme-name">Crimson</span>
                </button>
                <button class="theme-card" data-theme="theme-emerald-glass" type="button">
                  <span class="theme-dot" style="background: linear-gradient(135deg, #10b981, #06b6d4);"></span>
                  <span class="theme-name">Emerald</span>
                </button>
                <button class="theme-card active" data-theme="theme-nordic-frost" type="button">
                  <span class="theme-dot" style="background: linear-gradient(135deg, #e2e8f0, #94a3b8);"></span>
                  <span class="theme-name">Frost</span>
                </button>
              </div>
            </div>
            <div class="setting-item checkbox-row">
              <label for="check-album-tint">Album Art Ambient Background Tint</label>
              <input type="checkbox" id="check-album-tint" checked>
            </div>
          </div>

          <!-- Tab 2: Lyrics -->
          <div class="settings-tab-pane" id="tab-pane-lyrics">
            <div class="setting-item">
              <label>Lyrics Alignment</label>
              <div class="alignment-btn-group" id="alignment-group">
                <button type="button" class="alignment-btn" data-align="left">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="17" y1="10" x2="3" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line><line x1="17" y1="18" x2="3" y2="18"></line></svg>
                  <span>Left</span>
                </button>
                <button type="button" class="alignment-btn active" data-align="center">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="10" x2="6" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line><line x1="18" y1="18" x2="6" y2="18"></line></svg>
                  <span>Center</span>
                </button>
                <button type="button" class="alignment-btn" data-align="right">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="21" y1="10" x2="7" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line><line x1="21" y1="18" x2="7" y2="18"></line></svg>
                  <span>Right</span>
                </button>
              </div>
            </div>
            <div class="setting-item">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                <label for="range-orig-size">Original Lyrics Size</label>
                <span id="orig-size-val" style="font-size: 11px; color: var(--accent-primary);">18px</span>
              </div>
              <input type="range" id="range-orig-size" min="14" max="36" value="18" style="width: 100%; cursor: pointer;">
            </div>
            <div class="setting-item">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                <label for="range-sub-size">Sub-Text Size (Romaji/Meaning)</label>
                <span id="sub-size-val" style="font-size: 11px; color: var(--accent-primary);">11px</span>
              </div>
              <input type="range" id="range-sub-size" min="9" max="20" value="11" style="width: 100%; cursor: pointer;">
            </div>
            <div class="setting-item checkbox-row">
              <label for="check-show-romaji">Show Romaji / Pronunciation Sub-Text</label>
              <input type="checkbox" id="check-show-romaji" checked>
            </div>
            <div class="setting-item checkbox-row">
              <label for="check-show-translation">Show Translated Meaning Sub-Text</label>
              <input type="checkbox" id="check-show-translation" checked>
            </div>
          </div>

          <!-- Tab 3: Translation -->
          <div class="settings-tab-pane" id="tab-pane-translation">
            <div class="setting-item">
              <label for="select-target-lang">Translation Language</label>
              <select id="select-target-lang" class="custom-select">
                <option value="en">English (en)</option>
                <option value="zh">Chinese (zh)</option>
                <option value="fr">French (fr)</option>
                <option value="de">German (de)</option>
                <option value="id">Indonesian (id)</option>
                <option value="ja">Japanese (ja)</option>
                <option value="ko">Korean (ko)</option>
                <option value="es">Spanish (es)</option>
              </select>
            </div>
            <div class="setting-item" style="margin-top: 6px;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <label style="margin: 0; font-weight: 600;">Languages to Translate</label>
                <div style="display: flex; gap: 6px;">
                  <button type="button" id="btn-lang-all" class="mini-btn">All</button>
                  <button type="button" id="btn-lang-none" class="mini-btn">None</button>
                </div>
              </div>
              <div class="lang-checklist-grid" id="lang-checklist-grid">
                <label class="lang-chip"><input type="checkbox" name="trans-lang" value="ar" checked><img src="assets/flags/ar.svg" class="flag-icon" alt="Arabic"><span>Arabic</span></label>
                <label class="lang-chip"><input type="checkbox" name="trans-lang" value="zh" checked><img src="assets/flags/zh.svg" class="flag-icon" alt="China"><span>Chinese</span></label>
                <label class="lang-chip"><input type="checkbox" name="trans-lang" value="fr" checked><img src="assets/flags/fr.svg" class="flag-icon" alt="France"><span>French</span></label>
                <label class="lang-chip"><input type="checkbox" name="trans-lang" value="de" checked><img src="assets/flags/de.svg" class="flag-icon" alt="Germany"><span>German</span></label>
                <label class="lang-chip"><input type="checkbox" name="trans-lang" value="el" checked><img src="assets/flags/el.svg" class="flag-icon" alt="Greece"><span>Greek</span></label>
                <label class="lang-chip"><input type="checkbox" name="trans-lang" value="en" checked><img src="assets/flags/en.svg" class="flag-icon" alt="English"><span>English</span></label>
                <label class="lang-chip"><input type="checkbox" name="trans-lang" value="hi" checked><img src="assets/flags/hi.svg" class="flag-icon" alt="India"><span>Hindi</span></label>
                <label class="lang-chip"><input type="checkbox" name="trans-lang" value="id" checked><img src="assets/flags/id.svg" class="flag-icon" alt="Indonesia"><span>Indonesian</span></label>
                <label class="lang-chip"><input type="checkbox" name="trans-lang" value="it" checked><img src="assets/flags/it.svg" class="flag-icon" alt="Italy"><span>Italian</span></label>
                <label class="lang-chip"><input type="checkbox" name="trans-lang" value="ja" checked><img src="assets/flags/ja.svg" class="flag-icon" alt="Japan"><span>Japanese</span></label>
                <label class="lang-chip"><input type="checkbox" name="trans-lang" value="ko" checked><img src="assets/flags/ko.svg" class="flag-icon" alt="Korea"><span>Korean</span></label>
                <label class="lang-chip"><input type="checkbox" name="trans-lang" value="pt" checked><img src="assets/flags/pt.svg" class="flag-icon" alt="Portugal"><span>Portuguese</span></label>
                <label class="lang-chip"><input type="checkbox" name="trans-lang" value="ru" checked><img src="assets/flags/ru.svg" class="flag-icon" alt="Russia"><span>Russian</span></label>
                <label class="lang-chip"><input type="checkbox" name="trans-lang" value="es" checked><img src="assets/flags/es.svg" class="flag-icon" alt="Spain"><span>Spanish</span></label>
              </div>
            </div>
          </div>

          <!-- Tab 4: About -->
          <div class="settings-tab-pane" id="tab-pane-about">
            <div class="settings-about">
            <div class="about-card">
              <img src="assets/icon.png" class="about-icon" alt="LyricsFloat Icon">
              <div class="about-info">
                <div class="about-header-row">
                  <span class="about-app-title">LyricsFloat</span>
                  <span class="about-badge">v1.2.0 (260914)</span>
                </div>
                <span class="about-creator">Made by: <strong>ciszu</strong></span>
              </div>
            </div>

            <!-- In-App Changelog -->
            <div class="changelog-card">
              <div class="changelog-header" id="changelog-toggle">
                <span class="changelog-title">📋 Changelog</span>
                <span class="changelog-arrow" id="changelog-arrow">▼</span>
              </div>
              <div class="changelog-body" id="changelog-body">
                <!-- Dynamically populated by changelog.js -->
              </div>
            </div>
          </div>
          <!-- End Tab 4 -->
        </div>

      </div>
    </div>
  </div>

  <!-- Full-Size Artwork Preview Modal -->
  <div id="artwork-modal" class="artwork-modal-backdrop hidden" title="Click anywhere to close">
    <button id="btn-close-artwork" class="artwork-modal-close-btn" title="Close preview">&times;</button>
    <div class="artwork-modal-container">
      <img id="artwork-modal-img" class="artwork-modal-img" src="" alt="Album Artwork Preview">
    </div>
  </div>

  <script src="changelog.js"></script>
  <script src="lyrics-sync.js"></script>
  <script src="translation-pill.js"></script>
  <script src="marquee.js"></script>
  <script src="playback-controller.js"></script>
  <script src="settings-controller.js"></script>
  <script src="app.js"></script>
</body>
</html>
